name: E2E

on:
  pull_request:
    paths:
      - events/**
      - pet/**
      - plugin/**
      - scripts/install-plugin.js
      - scripts/build-native-pet.js
      - test/e2e/**
      - test/fixtures/**
      - test/run-all-tests.js
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      - events/**
      - pet/**
      - plugin/**
      - scripts/install-plugin.js
      - scripts/build-native-pet.js
      - test/e2e/**
      - test/fixtures/**
      - test/run-all-tests.js
      - .github/workflows/e2e.yml
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-native:
    name: Non-native E2E on Ubuntu
    runs-on: ubuntu-latest
    env:
      ELECTRON_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: pet/package-lock.json
      - run: npm ci --prefix pet
      - run: xvfb-run -a npm run test:e2e

  native-macos:
    name: Native macOS Pet
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: pet/package-lock.json
      - run: npm ci --prefix pet
      - run: npm run test:e2e
